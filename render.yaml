services:
  - type: web
    name: hgexyz-xyz
    env: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: FREE_NEWS_API_KEY
        sync: false
